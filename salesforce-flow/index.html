<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salesforce Integration — Flow Diagram</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23548235'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="../flow/styles.css" />
    <link rel="stylesheet" href="salesforce.css" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead masthead--sf">
        <div class="masthead-copy">
          <p class="eyebrow">Cedar Gate Salesforce Integration</p>
          <h1>Salesforce Flow Diagram</h1>
        </div>
        <div class="env-groups">
          <div class="env" aria-label="Salesforce environments">
            <p class="env-label">Salesforce</p>
            <a class="env-link env-qc" href="https://cedargate--chelsea.sandbox.my.salesforce.com/" target="_blank" rel="noopener noreferrer">
              <span class="env-tag">QC</span>
              <span class="env-host">cedargate--chelsea.sandbox</span>
            </a>
            <a class="env-link env-uat" href="https://cedargate--cguatfull.sandbox.my.salesforce.com/" target="_blank" rel="noopener noreferrer">
              <span class="env-tag">UAT</span>
              <span class="env-host">cedargate--cguatfull.sandbox</span>
            </a>
            <a class="env-link env-prod" href="https://cedargate.my.salesforce.com/" target="_blank" rel="noopener noreferrer">
              <span class="env-tag">PROD</span>
              <span class="env-host">cedargate.my.salesforce.com</span>
            </a>
          </div>
          <div class="env" aria-label="Client Portal environments">
            <p class="env-label">Client Portal</p>
            <a class="env-link env-uat" href="https://cedargate--cguatfull.sandbox.my.site.com/ClientPortal/s/" target="_blank" rel="noopener noreferrer">
              <span class="env-tag">UAT</span>
              <span class="env-host">ClientPortal/s</span>
            </a>
            <a class="env-link env-prod" href="https://cedargate.my.site.com/ClientPortal/s/" target="_blank" rel="noopener noreferrer">
              <span class="env-tag">PROD</span>
              <span class="env-host">ClientPortal/s</span>
            </a>
          </div>
        </div>
      </header>

      <nav class="tabs" id="tabs" aria-label="Integration flows"></nav>

      <section class="stage">
        <nav class="subtabs" id="subtabs" aria-label="Views"></nav>

        <div class="stage-head">
          <div>
            <h2 id="flow-title"></h2>
            <p id="flow-summary"></p>
          </div>
        </div>

        <div class="canvas-wrap">
          <div class="canvas" id="canvas">
            <svg class="wires" id="wires" aria-hidden="true">
              <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
                </marker>
                <marker id="arrow-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399" />
                </marker>
              </defs>
            </svg>
          </div>
        </div>

        <div class="legend" id="legend"></div>

        <section class="lambda" id="lambda" aria-label="Lambda flow"></section>

        <section class="guide" id="guide" aria-label="Reference"></section>

        <div class="controls">
          <button type="button" id="btn-play" class="ctrl primary">Pause</button>
          <button type="button" id="btn-reset" class="ctrl">Reset</button>
          <span class="status" id="status"></span>
        </div>
      </section>
    </div>

    <script src="flows.js"></script>
    <script src="../flow/app.js"></script>
  </body>
</html>
