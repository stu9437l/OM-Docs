<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operations Manager — Flow Diagram</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2334d399'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">Cedar Gate Operations Manager</p>
          <h1>Flow Diagram</h1>
          <p class="lede">
            Start with the module map, then open a module and its sub-views. Each module includes its
            Confluence user-guide details below the diagram. All identifiers are placeholders.
          </p>
        </div>
        <div class="env" aria-label="OM environments">
          <p class="env-label">Environments</p>
          <a class="env-link env-qc" href="https://om.qc.cgt.us/" target="_blank" rel="noopener noreferrer">
            <span class="env-tag">QC</span>
            <span class="env-host">om.qc.cgt.us</span>
          </a>
          <a class="env-link env-uat" href="https://om.uat.cgt.us/" target="_blank" rel="noopener noreferrer">
            <span class="env-tag">UAT</span>
            <span class="env-host">om.uat.cgt.us</span>
          </a>
          <a class="env-link env-prod" href="https://om.cgt.us/" target="_blank" rel="noopener noreferrer">
            <span class="env-tag">PROD</span>
            <span class="env-host">om.cgt.us</span>
          </a>
        </div>
      </header>

      <nav class="tabs" id="tabs" aria-label="Modules"></nav>

      <section class="stage">
        <nav class="subtabs" id="subtabs" aria-label="Views"></nav>

        <div class="stage-head">
          <div>
            <h2 id="flow-title"></h2>
            <p id="flow-summary"></p>
          </div>
          <code id="flow-route" class="route"></code>
        </div>

        <div class="canvas-wrap">
          <div class="canvas" id="canvas">
            <svg class="wires" id="wires" aria-hidden="true">
              <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
                </marker>
                <marker id="arrow-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399" />
                </marker>
              </defs>
            </svg>
          </div>
        </div>

        <div class="legend" id="legend"></div>

        <section class="lambda" id="lambda" aria-label="Lambda flow"></section>

        <section class="guide" id="guide" aria-label="User guide"></section>

        <div class="controls">
          <button type="button" id="btn-play" class="ctrl primary">Pause</button>
          <button type="button" id="btn-reset" class="ctrl">Reset</button>
          <span class="status" id="status"></span>
        </div>
      </section>
    </div>

    <script src="flows.js"></script>
    <script src="lambdas.js"></script>
    <script src="guide.js"></script>
    <script src="app.js"></script>
  </body>
</html>
